<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUKOCEF-O - Winning Combination</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 100vw;
    height: 100vh;
    font-family: 'Arial', sans-serif;
    background: linear-gradient(180deg, #f0f4f8 0%, #e3eaf0 40%, #d5dfe8 100%);
    overflow: hidden;
    position: relative;
    padding: 4vw;
  }

  .family-circle {
    width: clamp(80px, 14vw, 150px);
    height: clamp(80px, 14vw, 150px);
    border-radius: 50%;
    border: 0.4vw solid #d32f2f;
    background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 50%, #90caf9 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    animation: scaleIn 0.9s ease-out;
  }

  .family-inner {
    width: 65%; height: 65%;
    background: radial-gradient(ellipse at 50% 40%, rgba(33,150,243,0.25) 0%, rgba(66,165,245,0.15) 50%, transparent 80%);
    border-radius: 50%;
    animation: pulse 3s ease-in-out infinite;
  }

  .infection-text {
    font-size: clamp(0.8rem, 1.4vw, 1.2rem);
    color: #555;
    margin-top: 2.5vh;
    line-height: 1.5;
    opacity: 0;
    animation: fadeIn 0.8s ease-out 0.3s both;
  }

  .brand-name {
    font-size: clamp(1.5rem, 4vw, 3rem);
    color: #d32f2f;
    font-weight: bold;
    margin-top: 3vh;
    opacity: 0;
    animation: slideLeft 0.9s ease-out 0.5s both;
  }

  .composition {
    font-size: clamp(0.65rem, 1vw, 0.9rem);
    color: #666;
    margin-top: 1.5vh;
    opacity: 0;
    animation: fadeIn 0.8s ease-out 0.7s both;
  }

  .chess-piece {
    width: clamp(90px, 16vw, 180px);
    height: clamp(100px, 18vw, 200px);
    background: linear-gradient(135deg, #f5f5f5 0%, #e0e0e0 40%, #bdbdbd 100%);
    border-radius: 2vmin;
    margin: 3vh auto;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    animation: scaleIn 1s ease-out 0.9s both;
  }

  .chess-inner {
    width: 50%; height: 55%;
    background: linear-gradient(180deg, #9e9e9e 0%, #757575 40%, #616161 100%);
    clip-path: polygon(30% 0%, 70% 0%, 80% 20%, 100% 100%, 0% 100%, 20% 20%);
    animation: pulse 3s ease-in-out infinite 0.5s;
  }

  .feature-badges {
    position: absolute;
    right: 4vw; top: 25vh;
    display: flex;
    flex-direction: column;
    gap: 1.2vh;
    opacity: 0;
    animation: slideRight 0.8s ease-out 1.1s both;
  }

  .badge {
    background: linear-gradient(135deg, #d32f2f, #e53935);
    color: white;
    padding: 1vh 1.5vw;
    font-size: clamp(0.6rem, 0.85vw, 0.75rem);
    font-weight: bold;
    border-radius: 0.5vmin;
    text-align: center;
    width: clamp(80px, 12vw, 130px);
  }

  .tagline {
    font-size: clamp(1rem, 1.8vw, 1.5rem);
    color: #d32f2f;
    font-weight: bold;
    text-align: center;
    margin-top: 3vh;
    opacity: 0;
    animation: slideUp 0.8s ease-out 1.3s both;
  }

  .sure-success {
    font-size: clamp(0.8rem, 1.5vw, 1.3rem);
    color: #333;
    text-align: center;
    margin-top: 2vh;
    font-style: italic;
    opacity: 0;
    animation: fadeIn 0.8s ease-out 1.5s both;
  }

  .product-codes {
    position: absolute;
    bottom: 4vh; right: 4vw;
    display: flex;
    gap: 1vw;
    opacity: 0;
    animation: fadeIn 0.8s ease-out 1.7s both;
  }

  .code {
    background: linear-gradient(135deg, #d32f2f, #e53935);
    color: white;
    padding: 0.5vh 1vw;
    font-size: clamp(0.6rem, 0.85vw, 0.75rem);
    font-weight: bold;
  }

  @keyframes fadeIn {
    from { opacity: 0; } to { opacity: 1; }
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(3vh); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-3vh); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes slideLeft {
    from { opacity: 0; transform: translateX(-3vw); }
    to { opacity: 1; transform: translateX(0); }
  }
  @keyframes slideRight {
    from { opacity: 0; transform: translateX(3vw); }
    to { opacity: 1; transform: translateX(0); }
  }
  @keyframes scaleIn {
    from { opacity: 0; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }

  @media (max-width: 768px) {
    .feature-badges { right: 3vw; top: auto; bottom: 20vh; }
    .badge { width: 30vw; }
    .brand-name { font-size: clamp(1.3rem, 6vw, 2.2rem); }
    .chess-piece { width: 35vw; height: 40vw; }
    .product-codes { bottom: 10vh; }
  }
</style>
</head>
<body>
  <div class="family-circle">
    <div class="family-inner"></div>
  </div>

  <div class="infection-text">In Respiratory Tract Urinary Tract Infection and Typhoid Fever</div>

  <div class="brand-name">MUKOCEF-O</div>
  <div class="composition">Cefpodoxime Proxetil 200 mg + Ofloxacin 200 mg Tablets</div>

  <div class="chess-piece">
    <div class="chess-inner"></div>
  </div>

  <div class="feature-badges">
    <div class="badge">Potent combination</div>
    <div class="badge">Active against gram +/-</div>
    <div class="badge">Better Patient compliance</div>
    <div class="badge">Preferred combination</div>
  </div>

  <div class="tagline">Choose 'The Winning Combination'</div>
  <div class="sure-success">"SURE TO SUCCESS"</div>

  <div class="product-codes">
    <div class="code">MCO</div>
    <div class="code">QSP</div>
    <div class="code">DSR</div>
  </div>
</body>
</html>
