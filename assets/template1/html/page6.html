<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUKOCEF-O - Winning Combination</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 566px;
            height: 720px;
            font-family: 'Arial', sans-serif;
            background: #ffffff;
            overflow: hidden;
            position: relative;
            padding: 30px;
        }

        /* Circular family photo */
        .family-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 6px solid #d32f2f;
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            animation: scaleIn 1s ease-out;
        }

        .infection-text {
            font-size: 16px;
            color: #555;
            margin-top: 20px;
            line-height: 1.5;
            animation: fadeIn 1s ease-out 0.3s both;
        }

        .brand-name {
            font-size: 40px;
            color: #d32f2f;
            font-weight: bold;
            margin-top: 25px;
            animation: slideInLeft 1s ease-out 0.5s both;
        }

        .composition {
            font-size: 13px;
            color: #666;
            margin-top: 10px;
            animation: fadeIn 1s ease-out 0.7s both;
        }

        /* Chess piece */
        .chess-piece {
            width: 180px;
            height: 200px;
            background: linear-gradient(135deg, #f5f5f5 0%, #e0e0e0 100%);
            border-radius: 15px;
            margin: 25px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            animation: scaleIn 1.2s ease-out 0.9s both;
        }

        /* Feature badges */
        .feature-badges {
            position: absolute;
            right: 20px;
            top: 200px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            animation: slideInRight 1s ease-out 1.1s both;
        }

        .badge {
            background: #d32f2f;
            color: white;
            padding: 8px 12px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 5px;
            text-align: center;
            width: 130px;
        }

        .tagline {
            font-size: 20px;
            color: #d32f2f;
            font-weight: bold;
            text-align: center;
            margin-top: 25px;
            animation: fadeIn 1s ease-out 1.3s both;
        }

        .sure-success {
            font-size: 18px;
            color: #333;
            text-align: center;
            margin-top: 15px;
            font-style: italic;
            animation: fadeIn 1s ease-out 1.5s both;
        }

        .product-codes {
            position: absolute;
            bottom: 30px;
            right: 20px;
            display: flex;
            gap: 10px;
            animation: fadeIn 1s ease-out 1.7s both;
        }

        .code {
            background: #d32f2f;
            color: white;
            padding: 5px 10px;
            font-size: 12px;
            font-weight: bold;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="family-circle">👨‍👩‍👧‍👦</div>

    <div class="infection-text">In Respiratory Tract Urinary Tract Infection and Typhoid Fever</div>

    <div class="brand-name">MUKOCEF-O</div>
    <div class="composition">Cefpodoxime Proxetil 200 mg + Ofloxacin 200 mg Tablets</div>

    <div class="chess-piece">♟️</div>

    <div class="feature-badges">
        <div class="badge">Potent combination</div>
        <div class="badge">Active against gram +/-</div>
        <div class="badge">Better Patient compliance</div>
        <div class="badge">Preferred combination</div>
    </div>

    <div class="tagline">Choose 'The Winning Combination'</div>
    <div class="sure-success">"SURE TO SUCCESS"</div>

    <div class="product-codes">
        <div class="code">MCO</div>
        <div class="code">QSP</div>
        <div class="code">DSR</div>
    </div>
</body>
</html>
