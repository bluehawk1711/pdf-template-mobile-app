<!DOCTYPE html>

    overflow: hidden;

  }

  .red-top {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 10vh;
    background: linear-gradient(90deg, #d32f2f 0%, #e53935 50%, #d32f2f 100%);
    clip-path: polygon(0 0, 100% 0, 100% 60%, 80% 100%, 60% 70%, 40% 90%, 20% 60%, 0 80%);
    opacity: 0;
    animation: fadeIn 0.8s ease-out;
  }

  .title {
    position: absolute;
    top: 13vh; left: 5vw;
    font-size: clamp(1.2rem, 2.8vw, 2.2rem);
    color: #d32f2f;
    font-weight: bold;
    opacity: 0;
    animation: slideLeft 0.9s ease-out 0.15s both;
  }

  .brand-name {
    position: absolute;
    top: 19vh; left: 5vw;
    font-size: clamp(1.5rem, 3.5vw, 2.8rem);
    color: #d32f2f;
    font-weight: bold;
    opacity: 0;
    animation: slideLeft 0.9s ease-out 0.25s both;
  }

  .composition {
    position: absolute;
    top: 26vh; left: 5vw;
    font-size: clamp(0.7rem, 1.1vw, 1rem);

    opacity: 0;

  }

  .target {
    position: absolute;
    top: 32vh; left: 50%;
    transform: translateX(-50%);
    width: clamp(100px, 18vw, 200px);
    height: clamp(100px, 18vw, 200px);
    border-radius: 50%;
    background: repeating-radial-gradient(
      circle,
      #ffffff 0px, #ffffff 15%,
      #ffcdd2 15%, #ffcdd2 30%,
      #ef9a9a 30%, #ef9a9a 45%,
      #e53935 45%, #e53935 60%,
      #c62828 60%, #c62828 75%,
      #b71c1c 75%, #b71c1c 90%,
      #880e4f 90%, #880e4f 100%
    );
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    animation: scaleIn 1s ease-out 0.6s both;
  }

  .target-center {
    width: 25%; height: 25%;
    background: radial-gradient(circle, #b71c1c 0%, #c62828 60%, #e53935 100%);
    border-radius: 50%;
    animation: pulse 2s ease-in-out infinite 1s;
  }

  .feature-list {
    position: absolute;
    top: 55vh; left: 5vw;
    opacity: 0;
    animation: slideUp 0.7s ease-out 0.8s both;
  }

  .feature-item {
    display: flex;
    align-items: center;
    margin-bottom: 1vh;
    font-size: clamp(0.7rem, 1.1vw, 1rem);
    color: #333;
  }

  .feature-item::before {
    content: "\2022";
    color: #d32f2f;
    font-weight: bold;
    margin-right: 1vw;
    flex-shrink: 0;
  }

  .indication-section {
    position: absolute;
    top: 65vh; left: 5vw;
    opacity: 0;
    animation: fadeIn 0.8s ease-out 1s both;
  }

  .indication-title {
    font-size: clamp(0.9rem, 1.5vw, 1.3rem);
    color: #d32f2f;
    font-weight: bold;
    margin-bottom: 1vh;
  }

  .indication-list {
    list-style: disc;
    padding-left: 2.5vw;
    font-size: clamp(0.65rem, 1vw, 0.9rem);
    color: #444;
  }

  .indication-list li { margin-bottom: 0.5vh; }

  .tagline {
    position: absolute;
    bottom: 10vh; left: 5vw;
    font-size: clamp(1rem, 2vw, 1.6rem);
    color: #d32f2f;
    font-weight: bold;
    font-style: italic;
    opacity: 0;
    animation: slideLeft 0.8s ease-out 1.2s both;
  }

  .red-bottom {
    position: absolute;
    bottom: 0; left: 0;
    width: 100%; height: 8vh;
    background: linear-gradient(90deg, #d32f2f 0%, #e53935 50%, #d32f2f 100%);
    clip-path: polygon(0 40%, 20% 0, 40% 30%, 60% 10%, 80% 40%, 100% 20%, 100% 100%, 0 100%);
    opacity: 0;
    animation: fadeIn 0.8s ease-out 1.4s both;
  }

  @keyframes fadeIn {
    from { opacity: 0; } to { opacity: 1; }
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(3vh); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-3vh); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes slideLeft {
    from { opacity: 0; transform: translateX(-3vw); }
    to { opacity: 1; transform: translateX(0); }
  }
  @keyframes slideRight {
    from { opacity: 0; transform: translateX(3vw); }
    to { opacity: 1; transform: translateX(0); }
  }
  @keyframes scaleIn {
    from { opacity: 0; transform: translateX(-50%) scale(0.8); }
    to { opacity: 1; transform: translateX(-50%) scale(1); }
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }

  @media (max-width: 768px) {
    .title, .brand-name, .composition { left: 4vw; }
    .target { width: 35vw; height: 35vw; top: 35vh; }
    .feature-list, .indication-section { left: 4vw; }
    .brand-name { font-size: clamp(1.2rem, 6vw, 2rem); }
    .red-top { height: 8vh; }
    .red-bottom { height: 6vh; }
  }
</style>
</head>
<body>
  <div class="red-top"></div>

    <div class="feature-item">Convenient BID dosage</div>
  </div>

  <div class="indication-section">
    <div class="indication-title">Indications:</div>
    <ul class="indication-list">
      <li>Acute Otitis Media</li>
      <li>Sinusitis</li>
      <li>UTI</li>
      <li>Pharyngitis</li>
      <li>Skin infections</li>
      <li>Tonsillitis</li>
      <li>Gonorrhea</li>
    </ul>
  </div>

  <div class="tagline">Strike-the Right Target</div>

  <div class="red-bottom"></div>
