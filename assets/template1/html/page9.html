<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KL LAB - Thank You Doctor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 864px;
            height: 1128px;
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #e0e0e0 0%, #f5f5f5 50%, #e0e0e0 100%);
            overflow: hidden;
            position: relative;
            border: 15px solid #bdbdbd;
        }

        /* Gray/metallic border frame */
        .inner-frame {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            bottom: 15px;
            border: 3px solid #9e9e9e;
        }

        /* KL logos in corners */
        .kl-logo {
            position: absolute;
            width: 80px;
            height: 80px;
            background: #d32f2f;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
            z-index: 10;
        }

        .kl-tl { top: 30px; left: 30px; }
        .kl-tr { top: 30px; right: 30px; }
        .kl-bl { bottom: 30px; left: 30px; }
        .kl-br { bottom: 30px; right: 30px; }

        /* Family photo in curved frame */
        .family-frame {
            position: absolute;
            top: 120px;
            left: 50%;
            transform: translateX(-50%);
            width: 350px;
            height: 220px;
            border-radius: 50% 50% 20px 20px;
            border: 6px solid #d32f2f;
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            animation: scaleIn 1.2s ease-out;
        }

        /* Thank You text */
        .thank-you {
            position: absolute;
            top: 380px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 52px;
            color: #333;
            text-align: center;
            animation: fadeIn 1s ease-out 0.3s both;
        }

        .subtitle {
            position: absolute;
            top: 460px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            color: #666;
            text-align: center;
            font-style: italic;
            animation: fadeIn 1s ease-out 0.6s both;
        }

        /* Smiley face */
        .smiley {
            position: absolute;
            top: 530px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 60px;
            color: #f9a825;
            animation: scaleIn 1s ease-out 0.9s both;
        }

        /* KL LAB brand */
        .kl-lab-brand {
            position: absolute;
            top: 620px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 42px;
            color: #d32f2f;
            font-weight: bold;
            letter-spacing: 6px;
            animation: fadeIn 1s ease-out 1.2s both;
        }

        /* Horizontal line separator */
        .separator {
            position: absolute;
            top: 690px;
            left: 100px;
            right: 100px;
            height: 2px;
            background: #9e9e9e;
            animation: fadeIn 1s ease-out 1.4s both;
        }

        /* Visit Us section */
        .visit-us {
            position: absolute;
            top: 720px;
            left: 50%;
            transform: translateX(-50%);
            width: 550px;
            text-align: center;
            animation: fadeIn 1s ease-out 1.6s both;
        }

        .visit-title {
            font-size: 20px;
            color: #333;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .visit-address {
            font-size: 14px;
            color: #555;
            line-height: 1.6;
        }

        /* Red decorative waves at bottom */
        .red-waves {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 120px;
            background: linear-gradient(0deg, #d32f2f 0%, #e53935 40%, transparent 100%);
            clip-path: polygon(0 60%, 15% 40%, 30% 55%, 45% 35%, 60% 50%, 75% 30%, 90% 45%, 100% 25%, 100% 100%, 0 100%);
            animation: fadeIn 1s ease-out 1.8s both;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: translateX(-50%) scale(0.8); }
            to { opacity: 1; transform: translateX(-50%) scale(1); }
        }
    </style>
</head>
<body>
    <div class="inner-frame"></div>

    <div class="kl-logo kl-tl">KL</div>
    <div class="kl-logo kl-tr">KL</div>
    <div class="kl-logo kl-bl">KL</div>
    <div class="kl-logo kl-br">KL</div>

    <div class="family-frame">👨‍👩‍👧‍👦</div>

    <div class="thank-you">Thank You Doctor</div>
    <div class="subtitle">For Being my prescription to Happiness</div>

    <div class="smiley">:)</div>

    <div class="kl-lab-brand">KL LAB</div>

    <div class="separator"></div>

    <div class="visit-us">
        <div class="visit-title">Visit Us:</div>
        <div class="visit-address">
            K.L. LAB (A Division of K.L. Pharma)<br>
            Saraswati Vihar Block-C, Khoda Colony,<br>
            Ghaziabad U.P.-201001
        </div>
    </div>

    <div class="red-waves"></div>
</body>
</html>
